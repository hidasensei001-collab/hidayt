<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HidaTube Mobile App</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --yt-black: #0f0f0f;
      --yt-paper: #272727;
      --yt-paper-hover: #3f3f3f;
      --yt-red: #ff0000;
      --yt-text-primary: #f1f1f1;
      --yt-text-secondary: #aaa;
      --yt-border: rgba(255, 255, 255, 0.1);
      --bottom-nav-height: 56px;
      --top-nav-height: 48px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--yt-black);
      color: var(--yt-text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Container Aplikasi Mobile HidaTube */
    .app-viewport {
      width: 100%;
      max-width: 480px; /* Lebar Tampilan Mobile */
      background: var(--yt-black);
      min-height: 100vh;
      position: relative;
      padding-top: var(--top-nav-height);
      padding-bottom: calc(var(--bottom-nav-height) + 10px);
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    /* 1. TOP NAVBAR (HEADER ATAS HIDATUBE) */
    .top-header {
      position: fixed;
      top: 0;
      width: 100%;
      max-width: 480px;
      height: var(--top-nav-height);
      background: var(--yt-black);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      border-bottom: 1px solid var(--yt-border);
    }

    .yt-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      cursor: pointer;
    }

    .yt-logo i { color: var(--yt-red); font-size: 22px; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--yt-text-primary);
      font-size: 18px;
      cursor: pointer;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -6px;
      background: var(--yt-red);
      color: #fff;
      font-size: 9px;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 10px;
    }

    /* BAR PENCARIAN TERSEMBUNYI */
    .search-bar-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--yt-black);
      display: none;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      z-index: 101;
    }

    .search-bar-overlay.active { display: flex; }

    .search-input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--yt-paper);
      border-radius: 20px;
      padding: 6px 14px;
    }

    .search-input-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    /* 2. CATEGORY PILLS (CHIPS) */
    .chips-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: nowrap;
      background: var(--yt-black);
      border-bottom: 1px solid var(--yt-border);
      position: sticky;
      top: var(--top-nav-height);
      z-index: 90;
    }

    .chips-wrapper::-webkit-scrollbar { display: none; }

    .explore-chip {
      background: var(--yt-paper);
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .chip {
      background: var(--yt-paper);
      color: var(--yt-text-primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip.active {
      background: #ffffff;
      color: #0f0f0f;
    }

    /* 3. FEED UNTUK VIDEO CARDS */
    .feed-container {
      display: flex;
      flex-direction: column;
    }

    .video-card {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .thumbnail-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: #1e1e1e;
      position: relative;
    }

    .thumbnail-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .duration-badge {
      position: absolute;
      bottom: 8px; right: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .video-meta {
      display: flex;
      padding: 12px;
      gap: 12px;
    }

    .channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #333;
      object-fit: cover;
      flex-shrink: 0;
    }

    .meta-details {
      flex: 1;
    }

    .meta-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--yt-text-primary);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .meta-sub {
      font-size: 12px;
      color: var(--yt-text-secondary);
    }

    /* SHORTS SHELF IN FEED */
    .shorts-shelf {
      padding: 12px 0;
      border-top: 4px solid var(--yt-paper);
      border-bottom: 4px solid var(--yt-paper);
      margin-bottom: 16px;
    }

    .shelf-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      padding: 0 12px 10px 12px;
      color: #fff;
    }

    .shelf-title i { color: var(--yt-red); }

    .shorts-grid {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 12px;
    }
    .shorts-grid::-webkit-scrollbar { display: none; }

    .short-card {
      width: 140px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .short-thumb {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
    }

    .short-title {
      font-size: 12px;
      font-weight: 500;
      margin-top: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 4. PLAYER VIEW (PEMUTAR VIDEO DENGAN FULLSCREEN LANDSCAPE) */
    .player-view {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--yt-black);
      z-index: 200;
      overflow-y: auto;
      max-width: 480px;
      margin: 0 auto;
    }

    .player-view.active { display: block; }

    .player-header-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--yt-black);
    }

    .sticky-player {
      position: sticky;
      top: 0;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      z-index: 10;
    }

    .sticky-player iframe { width: 100%; height: 100%; border: none; }

    /* CSS Fullscreen Native untuk Player agar Layar Penuh Landscape */
    .sticky-player:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
    }
    .sticky-player:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
    }

    .watch-details {
      padding: 12px;
    }

    .watch-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .watch-stats {
      font-size: 12px;
      color: var(--yt-text-secondary);
      margin-bottom: 12px;
    }

    .channel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-subscribe {
      background: #fff;
      color: #0f0f0f;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    .action-bar-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .action-bar-scroll::-webkit-scrollbar { display: none; }

    .action-pill {
      background: var(--yt-paper);
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: pointer;
    }

    /* 5. BOTTOM NAVIGATION BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: var(--bottom-nav-height);
      background: var(--yt-black);
      border-top: 1px solid var(--yt-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--yt-text-primary);
      text-decoration: none;
      font-size: 10px;
      cursor: pointer;
      width: 20%;
    }

    .nav-item i { font-size: 18px; }

    .nav-item.active { color: #fff; }
    .nav-item.active i { color: #fff; }

    .create-btn i { font-size: 28px; }

    /* SPINNER */
    .loading-spinner {
      text-align: center;
      padding: 40px 0;
      color: var(--yt-text-secondary);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <header class="top-header">
      <div class="yt-logo" onclick="switchNav(document.querySelector('.nav-item'), 'beranda')">
        <i class="fa-brands fa-youtube"></i>
        <span>HidaTube</span>
      </div>

      <div class="header-actions">
        <button class="icon-btn"><i class="fa-solid fa-tv"></i></button>
        <button class="icon-btn">
          <i class="fa-regular fa-bell"></i>
          <span class="badge">9+</span>
        </button>
        <button class="icon-btn" onclick="toggleSearchOverlay(true)">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>

      <div class="search-bar-overlay" id="searchOverlay">
        <button class="icon-btn" onclick="toggleSearchOverlay(false)">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="search-input-box">
          <input type="text" id="searchInput" placeholder="Cari di HidaTube..." onkeyup="handleSearchKey(event)">
        </div>
        <button class="icon-btn" onclick="executeSearch()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </header>

    <nav class="chips-wrapper" id="chipsWrapper">
      <div class="explore-chip"><i class="fa-solid fa-compass"></i></div>
      <div class="chip active" onclick="filterCategory(this, '')">Semua</div>
      <div class="chip" onclick="filterCategory(this, 'YouTube Shorts Indonesia')">Shorts</div>
      <div class="chip" onclick="filterCategory(this, 'Otomotif Heavy Equipment Truck')">Otomotif & Alat Berat</div>
      <div class="chip" onclick="filterCategory(this, 'Web Development Tutorial')">Coding</div>
      <div class="chip" onclick="filterCategory(this, 'Lofi Chill Beats')">Musik</div>
      <div class="chip" onclick="filterCategory(this, 'Gaming Indonesia')">Gaming</div>
    </nav>

    <main id="mainContent">
      <div class="loading-spinner" id="loadingSpinner">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
        <p style="margin-top:8px; font-size:12px;">Memuat HidaTube...</p>
      </div>

      <div class="feed-container" id="feedContainer">
        </div>
    </main>

    <div class="player-view" id="playerView">
      <div class="player-header-bar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="icon-btn" onclick="closePlayerView()">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <span style="font-weight: 500; font-size: 14px;">Pemutar Video</span>
        </div>
        <button class="icon-btn" onclick="togglePlayerFullScreen()" title="Layar Penuh Landscape">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>

      <div class="sticky-player" id="stickyPlayer">
        <div id="ytPlayerContainer"></div>
      </div>

      <div class="watch-details">
        <h1 class="watch-title" id="watchTitle">Judul Video HidaTube</h1>
        <div class="watch-stats">12RB x ditonton • 2 jam yang lalu</div>

        <div class="channel-row">
          <div class="channel-info">
            <img src="https://via.placeholder.com/36" class="channel-avatar" id="watchAvatar" alt="Avatar">
            <div>
              <div style="font-weight: 700; font-size: 13px;" id="watchChannel">Nama Channel</div>
              <div style="font-size: 11px; color: var(--yt-text-secondary);">1.2JT subscriber</div>
            </div>
          </div>
          <button class="btn-subscribe" onclick="alert('Berhasil Subskrib!')">Subskrib</button>
        </div>

        <div class="action-bar-scroll">
          <div class="action-pill"><i class="fa-regular fa-thumbs-up"></i> 15RB</div>
          <div class="action-pill"><i class="fa-regular fa-thumbs-down"></i></div>
          <div class="action-pill" onclick="copyCurrentLink()"><i class="fa-solid fa-share"></i> Bagikan</div>
          <div class="action-pill" onclick="addToPlaylist()"><i class="fa-solid fa-plus"></i> Simpan</div>
          <div class="action-pill"><i class="fa-solid fa-download"></i> Download</div>
        </div>

        <h3 style="font-size: 14px; margin: 16px 0 10px 0;">Berikutnya</h3>
        <div id="recommendedFeed"></div>
      </div>
    </div>

    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchNav(this, 'beranda')">
        <i class="fa-solid fa-house"></i>
        <span>Beranda</span>
      </div>
      <div class="nav-item" onclick="switchNav(this, 'shorts')">
        <i class="fa-solid fa-bolt"></i>
        <span>Shorts</span>
      </div>
      <div class="nav-item create-btn" onclick="promptAddCustomVideo()">
        <i class="fa-regular fa-circle-plus"></i>
      </div>
      <div class="nav-item" onclick="switchNav(this, 'subscription')">
        <i class="fa-solid fa-layer-group"></i>
        <span>Subscription</span>
      </div>
      <div class="nav-item" onclick="switchNav(this, 'anda')">
        <i class="fa-regular fa-user"></i>
        <span>Anda</span>
      </div>
    </nav>

  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const apiKey = 'AIzaSyBc1XBpSqaAa9lOIlpLQDICfITMsc0Mfww';
    let ytPlayer = null;
    let currentVideoId = '';
    let videoList = [];
    let watchHistory = JSON.parse(localStorage.getItem('hidatube_history')) || [];

    // FUNGSI KONVERSI DURASI ISO 8601 (PT5S -> 00:05, PT1M20S -> 01:20) AKURAT
    function parseISO8601Duration(duration) {
      if (!duration) return '00:00';
      const match = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (!match) return '00:00';
      
      const hours = parseInt(match[1] || 0);
      const minutes = parseInt(match[2] || 0);
      const seconds = parseInt(match[3] || 0);

      const pad = (num) => String(num).padStart(2, '0');

      if (hours > 0) {
        return `${hours}:${pad(minutes)}:${pad(seconds)}`;
      }
      return `${pad(minutes)}:${pad(seconds)}`;
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayerContainer', {
        height: '100%',
        width: '100%',
        videoId: 'jfKfPfyJRdk',
        playerVars: { 
          'autoplay': 1, 
          'rel': 0, 
          'modestbranding': 1,
          'fs': 1
        }
      });
    }

    function toggleSearchOverlay(show) {
      document.getElementById('searchOverlay').classList.toggle('active', show);
      if (show) document.getElementById('searchInput').focus();
    }

    function handleSearchKey(e) {
      if (e.key === 'Enter') executeSearch();
    }

    function showLoading(show) {
      document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
      document.getElementById('feedContainer').style.display = show ? 'none' : 'flex';
    }

    // MEMUAT TRENDING DENGAN DURASI REAL DARI API
    async function loadTrendingVideos() {
      showLoading(true);
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails&chart=mostPopular&regionCode=ID&maxResults=15&key=${apiKey}`);
        const data = await res.json();
        if (data.items) {
          videoList = data.items.map(item => ({
            id: item.id,
            title: item.snippet.title,
            channel: item.snippet.channelTitle,
            duration: parseISO8601Duration(item.contentDetails ? item.contentDetails.duration : ''),
            thumb: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
          }));
          renderFeed(videoList);
        }
      } catch (err) {
        console.warn('Gagal memuat API:', err);
      } finally {
        showLoading(false);
      }
    }

    // MEMUAT HASIL PENCARIAN DENGAN DURASI REAL AKURAT
    async function executeSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      toggleSearchOverlay(false);
      showLoading(true);

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${apiKey}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          const videoIds = data.items.map(item => item.id.videoId).join(',');
          // Ambil detail durasi presisi via videos.list
          const detailsRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet&id=${videoIds}&key=${apiKey}`);
          const detailsData = await detailsRes.json();

          videoList = detailsData.items.map(item => ({
            id: item.id,
            title: item.snippet.title,
            channel: item.snippet.channelTitle,
            duration: parseISO8601Duration(item.contentDetails ? item.contentDetails.duration : ''),
            thumb: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
          }));
          
          renderFeed(videoList);
        }
      } catch (err) {
        alert('Gagal mengambil pencarian.');
      } finally {
        showLoading(false);
      }
    }

    function renderFeed(items) {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding:40px; color:#aaa; font-size:13px;">Tidak ada video.</p>';
        return;
      }

      items.forEach((v, index) => {
        if (index === 2) {
          const shortsShelf = document.createElement('div');
          shortsShelf.className = 'shorts-shelf';
          shortsShelf.innerHTML = `
            <div class="shelf-title"><i class="fa-solid fa-bolt"></i> Shorts</div>
            <div class="shorts-grid">
              ${items.slice(0, 4).map(s => `
                <div class="short-card" onclick="playVideo('${s.id}', '${escapeQuotes(s.title)}', '${escapeQuotes(s.channel)}')">
                  <img src="${s.thumb}" class="short-thumb" alt="short">
                  <div class="short-title">${s.title}</div>
                </div>
              `).join('')}
            </div>
          `;
          container.appendChild(shortsShelf);
        }

        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => playVideo(v.id, v.title, v.channel);

        card.innerHTML = `
          <div class="thumbnail-box">
            <img src="${v.thumb}" alt="thumb">
            <span class="duration-badge">${v.duration || '00:00'}</span>
          </div>
          <div class="video-meta">
            <img src="https://picsum.photos/seed/${v.id}/100" class="channel-avatar" alt="avatar">
            <div class="meta-details">
              <div class="meta-title">${v.title}</div>
              <div class="meta-sub">${v.channel} • 45RB x ditonton • 1 hari yang lalu</div>
            </div>
            <i class="fa-solid fa-ellipsis-vertical" style="color: var(--yt-text-secondary); font-size:14px;"></i>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function playVideo(id, title, channel) {
      currentVideoId = id;
      document.getElementById('watchTitle').innerText = title;
      document.getElementById('watchChannel').innerText = channel;
      document.getElementById('watchAvatar').src = `https://picsum.photos/seed/${id}/100`;

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(id);
      }

      addToHistory({ id, title, channel });
      renderRecommended();
      document.getElementById('playerView').classList.add('active');
    }

    function closePlayerView() {
      if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      document.getElementById('playerView').classList.remove('active');
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    }

    // FUNGSI OOTOMATIS ORIENTASI LAYAR KE LANDSCAPE FULLSCREEN
    async function togglePlayerFullScreen() {
      const elem = document.getElementById('stickyPlayer');
      
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          await elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          await elem.webkitRequestFullscreen();
        }

        // Kunci Orientasi ke LANDSCAPE jika didukung oleh HP/Browser
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(err => console.log('Rotation note:', err));
        }
      } else {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        }
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    }

    function renderRecommended() {
      const recContainer = document.getElementById('recommendedFeed');
      recContainer.innerHTML = '';
      videoList.filter(v => v.id !== currentVideoId).forEach(v => {
        const item = document.createElement('div');
        item.className = 'video-card';
        item.onclick = () => playVideo(v.id, v.title, v.channel);
        item.innerHTML = `
          <div class="thumbnail-box">
            <img src="${v.thumb}">
            <span class="duration-badge">${v.duration || '00:00'}</span>
          </div>
          <div class="video-meta">
            <img src="https://picsum.photos/seed/${v.id}/100" class="channel-avatar">
            <div class="meta-details">
              <div class="meta-title">${v.title}</div>
              <div class="meta-sub">${v.channel} • 12RB x ditonton</div>
            </div>
          </div>
        `;
        recContainer.appendChild(item);
      });
    }

    function filterCategory(el, query) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      if (!query) loadTrendingVideos();
      else {
        document.getElementById('searchInput').value = query;
        executeSearch();
      }
    }

    function switchNav(el, tab) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');

      const container = document.getElementById('feedContainer');

      if (tab === 'beranda') {
        document.getElementById('chipsWrapper').style.display = 'flex';
        loadTrendingVideos();
      } else if (tab === 'shorts') {
        document.getElementById('chipsWrapper').style.display = 'none';
        executeSearchQuery('YouTube Shorts Indonesia');
      } else if (tab === 'subscription') {
        document.getElementById('chipsWrapper').style.display = 'none';
        container.innerHTML = '<div style="padding:30px; text-align:center; color:#aaa;"><h3>Subscription Terikhtisar</h3><p style="font-size:12px; margin-top:8px;">Video terbaru dari channel favorit Anda di HidaTube akan muncul di sini.</p></div>';
      } else if (tab === 'anda') {
        document.getElementById('chipsWrapper').style.display = 'none';
        renderAndaProfile();
      }
    }

    function renderAndaProfile() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = `
        <div style="padding: 16px;">
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
            <i class="fa-solid fa-circle-user fa-3x" style="color: var(--yt-text-secondary);"></i>
            <div>
              <h2 style="font-size:18px;">Pengguna HidaTube</h2>
              <p style="font-size:12px; color:var(--yt-text-secondary);">@user-hidatube • Lihat Channel</p>
            </div>
          </div>
          <h3 style="font-size:15px; margin-bottom:10px;"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Tontonan</h3>
          <div style="display:flex; gap:10px; overflow-x:auto; padding-bottom:10px;">
            ${watchHistory.map(h => `
              <div style="width:120px; flex-shrink:0; cursor:pointer;" onclick="playVideo('${h.id}', '${escapeQuotes(h.title)}', '${escapeQuotes(h.channel)}')">
                <img src="https://img.youtube.com/vi/${h.id}/hqdefault.jpg" style="width:100%; height:70px; border-radius:8px; object-fit:cover;">
                <div style="font-size:11px; font-weight:500; margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${h.title}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    async function executeSearchQuery(q) {
      document.getElementById('searchInput').value = q;
      executeSearch();
    }

    function addToHistory(item) {
      watchHistory = watchHistory.filter(v => v.id !== item.id);
      watchHistory.unshift(item);
      localStorage.setItem('hidatube_history', JSON.stringify(watchHistory));
    }

    function addToPlaylist() {
      alert('Tersimpan di Playlist HidaTube Anda!');
    }

    function copyCurrentLink() {
      navigator.clipboard.writeText(`https://www.youtube.com/watch?v=${currentVideoId}`);
      alert('Link disalin ke clipboard!');
    }

    function promptAddCustomVideo() {
      const url = prompt('Masukkan Link Video YouTube atau Video ID:');
      if (url) {
        const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(reg);
        const id = (match && match[2].length === 11) ? match[2] : url;
        playVideo(id, 'Video Pilihan Anda', 'Custom Source');
      }
    }

    function escapeQuotes(str) {
      return str ? str.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadTrendingVideos();
    });
  </script>
</body>
</html>
