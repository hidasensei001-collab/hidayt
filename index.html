<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenTube - Premium YouTube Player</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --bg-dark: #0f172a;
      --glass-bg: rgba(15, 23, 42, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-card: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: var(--bg-dark);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 20px 16px; }

    /* Header & Navigation */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      padding: 16px 24px;
      border-radius: 20px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 20px;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand i { color: #ef4444; -webkit-text-fill-color: initial; }

    /* Input Link Bar */
    .search-box {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 550px;
      margin: 0 20px;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.3s;
    }

    .search-input-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
    }

    .btn-add {
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-add:hover { transform: translateY(-2px); opacity: 0.95; }

    /* Main Layout Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      transition: all 0.3s ease;
    }

    .main-grid.theater-mode {
      grid-template-columns: 1fr;
    }

    .main-grid.theater-mode .sidebar-section {
      display: none;
    }

    /* Player Container */
    .player-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .player-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .video-info h2 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .video-info p {
      font-size: 12px;
      color: var(--text-sub);
    }

    .action-btns {
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-icon.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* Playlist Sidebar */
    .sidebar-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      height: fit-content;
      max-height: 720px;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--glass-border);
    }

    .sidebar-header h3 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .playlist-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-right: 4px;
      max-height: 580px;
    }

    .playlist-items::-webkit-scrollbar { width: 4px; }
    .playlist-items::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

    .playlist-item {
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--glass-border);
      padding: 8px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(3px);
    }

    .playlist-item.active {
      border-color: var(--accent);
      background: rgba(6, 182, 212, 0.12);
    }

    .item-thumb {
      width: 100px;
      height: 58px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .item-title {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .item-author {
      font-size: 11px;
      color: var(--text-sub);
    }

    .btn-delete {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(239, 68, 68, 0.2);
      border: none;
      color: #ef4444;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .playlist-item:hover .btn-delete { display: flex; }
    .btn-delete:hover { background: #ef4444; color: #fff; }

    /* Preset Showcase Grid */
    .preset-section {
      margin-top: 32px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .preset-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .preset-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
    }

    .preset-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .preset-card h4 {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
      .search-box { margin: 12px 0 0 0; width: 100%; max-width: 100%; }
      .nav-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- NAVBAR -->
    <div class="nav-bar">
      <div class="brand">
        <i class="fa-brands fa-youtube"></i> ZenTube Premium
      </div>
      
      <div class="search-box">
        <div class="search-input-wrapper">
          <i class="fa-solid fa-link"></i>
          <input type="text" id="videoUrlInput" placeholder="Paste link video YouTube di sini..." autocomplete="off">
        </div>
        <button class="btn-add" onclick="handleAddVideo()">
          <i class="fa-solid fa-plus"></i> Putar
        </button>
      </div>
    </div>

    <!-- MAIN PLAYER & PLAYLIST AREA -->
    <div class="main-grid" id="mainGrid">
      
      <!-- LEFT: VIDEO PLAYER -->
      <div class="player-section">
        <div class="player-card">
          <div class="video-wrapper">
            <iframe id="mainPlayer" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&enablejsapi=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          
          <div class="player-controls">
            <div class="video-info">
              <h2 id="currentVideoTitle">Lofi Hip Hop Radio - Beats to Relax/Study to</h2>
              <p id="currentVideoSubtitle">Sedang Diputar • Auto-Save Enabled</p>
            </div>
            <div class="action-btns">
              <button class="btn-icon" id="theaterBtn" onclick="toggleTheaterMode()">
                <i class="fa-solid fa-expand"></i> Teater
              </button>
              <button class="btn-icon" onclick="copyCurrentLink()">
                <i class="fa-solid fa-share-nodes"></i> Bagikan
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: PLAYLIST SIDEBAR -->
      <div class="sidebar-section">
        <div class="sidebar-card">
          <div class="sidebar-header">
            <h3><i class="fa-solid fa-list-ul" style="color: var(--accent);"></i> Playlist Kamu</h3>
            <span style="font-size: 11px; color: var(--text-sub);" id="playlistCount">0 Video</span>
          </div>

          <div class="playlist-items" id="playlistContainer">
            <!-- Item Playlist dirender via Javascript -->
          </div>
        </div>
      </div>

    </div>

    <!-- PRESET REKOMENDASI -->
    <div class="preset-section">
      <div class="section-title">
        <i class="fa-solid fa-fire" style="color: #f59e0b;"></i> Rekomendasi Pilihan
      </div>
      <div class="preset-grid">
        
        <div class="preset-card" onclick="playVideo('jfKfPfyJRdk', 'Lofi Girl - Beats to Study To', 'Lofi Girl')">
          <img src="https://img.youtube.com/vi/jfKfPfyJRdk/hqdefault.jpg" alt="Lofi">
          <h4>Lofi Girl - Relax & Study</h4>
          <p style="font-size: 11px; color: var(--text-sub);">Lofi Hip Hop</p>
        </div>

        <div class="preset-card" onclick="playVideo('5qap5aO4i9A', 'Lofi Hip Hop Radio - Chill Beats', 'Lofi Girl')">
          <img src="https://img.youtube.com/vi/5qap5aO4i9A/hqdefault.jpg" alt="Chill">
          <h4>Chill Radio Beats</h4>
          <p style="font-size: 11px; color: var(--text-sub);">Sleep & Relax</p>
        </div>

        <div class="preset-card" onclick="playVideo('TURbeVR03HQ', 'Synthwave Radio - Chill synth / Retro', 'Lofi Girl')">
          <img src="https://img.youtube.com/vi/TURbeVR03HQ/hqdefault.jpg" alt="Synthwave">
          <h4>Synthwave Retro Radio</h4>
          <p style="font-size: 11px; color: var(--text-sub);">Retro Vibes</p>
        </div>

        <div class="preset-card" onclick="playVideo('4xDzrJKXOOY', 'synthwave radio - chill / retro beats', 'Lofi Girl')">
          <img src="https://img.youtube.com/vi/4xDzrJKXOOY/hqdefault.jpg" alt="Chill synth">
          <h4>Chill Synthwave Beats</h4>
          <p style="font-size: 11px; color: var(--text-sub);">Midnight Chill</p>
        </div>

      </div>
    </div>

  </div>

  <script>
    // Initial Playlist Data
    let defaultPlaylist = [
      { id: 'jfKfPfyJRdk', title: 'Lofi Girl - Beats to Study To', author: 'Lofi Girl' },
      { id: '5qap5aO4i9A', title: 'Lofi Hip Hop Radio - Sleep Beats', author: 'Lofi Girl' },
      { id: 'TURbeVR03HQ', title: 'Synthwave Radio - Chill synth / Retro', author: 'Lofi Girl' }
    ];

    let playlist = JSON.parse(localStorage.getItem('zentube_playlist')) || defaultPlaylist;
    let currentVideoId = playlist[0] ? playlist[0].id : 'jfKfPfyJRdk';

    // Helper: Ekstrak YouTube ID dari berbagai format link
    function extractYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
    }

    // Render daftar playlist
    function renderPlaylist() {
      const container = document.getElementById('playlistContainer');
      const countEl = document.getElementById('playlistCount');
      container.innerHTML = '';
      countEl.innerText = `${playlist.length} Video`;

      playlist.forEach((item, index) => {
        const activeClass = item.id === currentVideoId ? 'active' : '';
        const itemEl = document.createElement('div');
        itemEl.className = `playlist-item ${activeClass}`;
        itemEl.onclick = (e) => {
          if (!e.target.closest('.btn-delete')) {
            playVideo(item.id, item.title, item.author);
          }
        };

        itemEl.innerHTML = `
          <div class="item-thumb">
            <img src="https://img.youtube.com/vi/${item.id}/hqdefault.jpg" alt="thumb">
          </div>
          <div class="item-details">
            <div class="item-title">${item.title}</div>
            <div class="item-author">${item.author || 'YouTube Video'}</div>
          </div>
          <button class="btn-delete" onclick="deleteFromPlaylist(${index})">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;
        container.appendChild(itemEl);
      });

      localStorage.setItem('zentube_playlist', JSON.stringify(playlist));
    }

    // Fungsi Putar Video
    function playVideo(id, title = 'YouTube Video', author = 'Custom Input') {
      currentVideoId = id;
      const iframe = document.getElementById('mainPlayer');
      iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1`;

      document.getElementById('currentVideoTitle').innerText = title;
      document.getElementById('currentVideoSubtitle').innerText = `${author} • Sedang Diputar`;

      renderPlaylist();
    }

    // Handle Input Tambah Video Baru
    function handleAddVideo() {
      const input = document.getElementById('videoUrlInput');
      const rawValue = input.value.trim();

      if (!rawValue) return;

      const videoId = extractYouTubeID(rawValue);

      if (videoId) {
        const newVideo = {
          id: videoId,
          title: `Video YouTube (${videoId})`,
          author: 'User Added'
        };

        // Cek jika sudah ada
        if (!playlist.some(v => v.id === videoId)) {
          playlist.unshift(newVideo);
        }

        playVideo(videoId, newVideo.title, newVideo.author);
        input.value = '';
      } else {
        alert('Format URL YouTube tidak valid! Masukkan link video yang sesuai.');
      }
    }

    // Hapus dari Playlist
    function deleteFromPlaylist(index) {
      playlist.splice(index, 1);
      renderPlaylist();
    }

    // Toggle Mode Teater
    function toggleTheaterMode() {
      const mainGrid = document.getElementById('mainGrid');
      const theaterBtn = document.getElementById('theaterBtn');
      mainGrid.classList.toggle('theater-mode');
      theaterBtn.classList.toggle('active');
    }

    // Copy Link Video Saat Ini
    function copyCurrentLink() {
      const url = `https://www.youtube.com/watch?v=${currentVideoId}`;
      navigator.clipboard.writeText(url).then(() => {
        alert('Link video berhasil disalin ke clipboard!');
      });
    }

    // Init Render
    window.addEventListener('DOMContentLoaded', () => {
      renderPlaylist();
    });
  </script>
</body>
</html>
