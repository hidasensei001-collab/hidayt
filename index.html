<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenTube - Premium YouTube Player</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --bg-dark: #0f172a;
      --glass-bg: rgba(15, 23, 42, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-card: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: var(--bg-dark);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .container { max-width: 1380px; margin: 0 auto; padding: 16px; }

    /* Header & Navigation Mobile-Friendly */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      padding: 14px 20px;
      border-radius: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }
    .brand i { color: #ef4444; -webkit-text-fill-color: initial; }

    /* Search Bar Responsive */
    .search-box {
      display: flex;
      gap: 8px;
      flex: 1;
      width: 100%;
      max-width: 650px;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.3s;
    }

    .search-input-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
    }

    .btn-action {
      padding: 10px 18px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-action:hover { transform: translateY(-2px); opacity: 0.95; }

    /* Category Pills Scrollable */
    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: thin;
    }

    .categories-bar::-webkit-scrollbar { height: 4px; }
    .categories-bar::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

    .category-pill {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--glass-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .category-pill:hover, .category-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Main Grid Layout */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      transition: all 0.3s ease;
    }

    .main-grid.theater-mode { grid-template-columns: 1fr; }
    .main-grid.theater-mode .sidebar-section { display: none; }

    /* Player Container */
    .player-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Video Wrapper: Dynamic Aspect Ratio for Long vs Shorts */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      margin: 0 auto;
      transition: all 0.3s ease;
    }

    /* Mode khusus jika memutar Shorts */
    .video-wrapper.shorts-mode {
      aspect-ratio: 9 / 16;
      max-width: 360px;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* Fullscreen CSS Native Fix */
    .video-wrapper:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      border-radius: 0 !important;
    }
    .video-wrapper:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      border-radius: 0 !important;
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    .video-info h2 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .channel-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--glass-border);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .channel-badge:hover {
      background: rgba(6, 182, 212, 0.2);
      color: #fff;
    }

    .action-btns {
      display: flex;
      gap: 8px;
      width: 100%;
      flex-wrap: wrap;
    }

    .btn-icon {
      flex: 1;
      min-width: 100px;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-icon:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .btn-icon.active { background: var(--primary); border-color: var(--primary); }

    /* Sidebar Tabs & Lists */
    .sidebar-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    .tab-header {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .video-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 600px;
    }

    .video-list::-webkit-scrollbar { width: 4px; }
    .video-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

    .video-item {
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--glass-border);
      padding: 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .video-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .video-item.active {
      border-color: var(--accent);
      background: rgba(6, 182, 212, 0.12);
    }

    .item-thumb {
      width: 100px;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      background: #000;
    }

    /* Thumbnail khusus Shorts di list */
    .video-item.is-short-item .item-thumb {
      width: 55px;
      aspect-ratio: 9 / 16;
    }

    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .item-title {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .item-author {
      font-size: 10px;
      color: var(--accent);
    }

    .btn-add-playlist {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(6, 182, 212, 0.2);
      border: none;
      color: var(--accent);
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .video-item:hover .btn-add-playlist { display: flex; }
    .btn-add-playlist:hover { background: var(--accent); color: #fff; }

    .loading-spinner {
      display: none;
      text-align: center;
      padding: 30px 0;
      color: var(--accent);
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
      .nav-bar { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- NAVBAR -->
    <div class="nav-bar">
      <div class="brand" onclick="loadTrendingVideos()">
        <i class="fa-brands fa-youtube"></i> ZenTube Premium
      </div>
      
      <div class="search-box">
        <div class="search-input-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Cari video, shorts, channel, atau paste link..." onkeyup="handleKeyPress(event)">
        </div>
        <button class="btn-action" onclick="executeSearch()">
          <i class="fa-solid fa-magnifying-glass"></i> Cari
        </button>
      </div>
    </div>

    <!-- CATEGORY PILLS -->
    <div class="categories-bar">
      <div class="category-pill active" onclick="filterCategory(this, '')">🔥 Populer</div>
      <div class="category-pill" onclick="filterCategory(this, 'YouTube Shorts Indonesia')">📱 Shorts</div>
      <div class="category-pill" onclick="filterCategory(this, 'Lofi Chill Beats')">🎧 Lofi Chill</div>
      <div class="category-pill" onclick="filterCategory(this, 'Musik Hits Indonesia')">🎵 Musik</div>
      <div class="category-pill" onclick="filterCategory(this, 'Gaming Indonesia')">🎮 Gaming</div>
      <div class="category-pill" onclick="filterCategory(this, 'Otomotif Heavy Equipment Truck')">🚜 Otomotif & Alat Berat</div>
      <div class="category-pill" onclick="filterCategory(this, 'Web Development Tutorial')">💻 Coding</div>
    </div>

    <!-- MAIN GRID -->
    <div class="main-grid" id="mainGrid">
      
      <!-- LEFT: VIDEO PLAYER -->
      <div class="player-section">
        <div class="player-card">
          <div class="video-wrapper" id="videoWrapper">
            <div id="playerContainer"></div>
          </div>
          
          <div class="player-controls">
            <div class="video-info">
              <h2 id="currentVideoTitle">Memuat video...</h2>
              <div class="channel-badge" id="currentChannelBadge" onclick="openChannelFromBadge()">
                <i class="fa-solid fa-circle-user"></i> <span id="currentChannelName">ZenTube</span>
              </div>
            </div>
            <div class="action-btns">
              <button class="btn-icon" id="fullscreenBtn" onclick="toggleFullScreen()">
                <i class="fa-solid fa-expand"></i> Fullscreen
              </button>
              <button class="btn-icon" id="theaterBtn" onclick="toggleTheaterMode()">
                <i class="fa-solid fa-table-columns"></i> Teater
              </button>
              <button class="btn-icon" onclick="copyCurrentLink()">
                <i class="fa-solid fa-share-nodes"></i> Bagikan
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: SIDEBAR -->
      <div class="sidebar-section">
        <div class="sidebar-card">
          <div class="tab-header">
            <button class="tab-btn active" id="tabSearchResults" onclick="switchTab('search')">
              <i class="fa-solid fa-magnifying-glass"></i> Feed
            </button>
            <button class="tab-btn" id="tabPlaylist" onclick="switchTab('playlist')">
              <i class="fa-solid fa-list"></i> Playlist
            </button>
            <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">
              <i class="fa-solid fa-clock-rotate-left"></i> Riwayat
            </button>
          </div>

          <div class="loading-spinner" id="loadingSpinner">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
            <p style="font-size: 11px; margin-top: 8px; color: var(--text-sub);">Memuat video...</p>
          </div>

          <div class="video-list" id="sidebarContainer">
            <!-- Item dirender via JS -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- LOAD YOUTUBE IFRAME API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const apiKey = 'AIzaSyBc1XBpSqaAa9lOIlpLQDICfITMsc0Mfww';

    let ytPlayer = null;
    let currentVideoId = 'jfKfPfyJRdk';
    let currentChannelId = '';
    let isCurrentVideoShort = false;
    let activeTab = 'search';
    
    let searchResults = [];
    let savedPlaylist = JSON.parse(localStorage.getItem('zentube_playlist')) || [];
    let watchHistory = JSON.parse(localStorage.getItem('zentube_history')) || [];

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('playerContainer', {
        height: '100%',
        width: '100%',
        videoId: currentVideoId,
        playerVars: {
          'autoplay': 1,
          'rel': 0,
          'modestbranding': 1
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        playNextVideo();
      }
    }

    function playNextVideo() {
      let currentList = activeTab === 'search' ? searchResults : (activeTab === 'playlist' ? savedPlaylist : watchHistory);
      currentList = currentList.filter(item => !item.isChannel);

      if (currentList.length === 0) return;

      const currentIndex = currentList.findIndex(v => v.id === currentVideoId);
      if (currentIndex !== -1 && currentIndex + 1 < currentList.length) {
        const nextVideo = currentList[currentIndex + 1];
        playVideo(nextVideo.id, nextVideo.title, nextVideo.author, nextVideo.channelId);
      }
    }

    function extractYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') executeSearch();
    }

    function showSpinner(show) {
      document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
      document.getElementById('sidebarContainer').style.display = show ? 'none' : 'flex';
    }

    function filterCategory(el, query) {
      document.querySelectorAll('.category-pill').forEach(pill => pill.classList.remove('active'));
      el.classList.add('active');
      
      if (!query) {
        loadTrendingVideos();
      } else {
        document.getElementById('searchInput').value = query;
        executeSearch();
      }
    }

    async function loadTrendingVideos() {
      showSpinner(true);
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&regionCode=ID&maxResults=20&key=${apiKey}`);
        const data = await res.json();

        if (data.items && data.items.length > 0) {
          searchResults = data.items.map(item => ({
            id: item.id,
            title: item.snippet.title,
            author: item.snippet.channelTitle,
            channelId: item.snippet.channelId
          }));

          switchTab('search');
          const first = searchResults[0];
          playVideo(first.id, first.title, first.author, first.channelId);
        }
      } catch (err) {
        console.warn('Gagal memuat trending video:', err);
      } finally {
        showSpinner(false);
      }
    }

    async function executeSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const directId = extractYouTubeID(query);
      if (directId) {
        const isShortsUrl = query.includes('shorts/');
        playVideo(directId, `Video (${directId})`, 'YouTube Direct', '', isShortsUrl);
        return;
      }

      showSpinner(true);
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video,channel&key=${apiKey}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          searchResults = data.items.map(item => {
            if (item.id.kind === 'youtube#channel') {
              return {
                isChannel: true,
                channelId: item.id.channelId,
                title: `📢 CHANNEL: ${item.snippet.channelTitle}`,
                author: item.snippet.description || 'Channel YouTube',
                thumb: item.snippet.thumbnails.default.url
              };
            }
            return {
              id: item.id.videoId,
              title: item.snippet.title,
              author: item.snippet.channelTitle,
              channelId: item.snippet.channelId
            };
          });

          switchTab('search');
          const firstVideo = searchResults.find(v => !v.isChannel);
          if (firstVideo) {
            playVideo(firstVideo.id, firstVideo.title, firstVideo.author, firstVideo.channelId);
          }
        }
      } catch (err) {
        alert('Gagal mengambil data dari YouTube API.');
      } finally {
        showSpinner(false);
      }
    }

    async function openChannelVideos(chId, chTitle) {
      showSpinner(true);
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${chId}&maxResults=20&order=date&type=video&key=${apiKey}`);
        const data = await res.json();

        if (data.items) {
          searchResults = data.items.map(item => ({
            id: item.id.videoId,
            title: item.snippet.title,
            author: chTitle,
            channelId: chId
          }));

          switchTab('search');
          if (searchResults.length > 0) {
            playVideo(searchResults[0].id, searchResults[0].title, searchResults[0].author, chId);
          }
        }
      } catch (err) {
        alert('Gagal memuat video dari channel ini.');
      } finally {
        showSpinner(false);
      }
    }

    function openChannelFromBadge() {
      if (currentChannelId) {
        const chName = document.getElementById('currentChannelName').innerText;
        openChannelVideos(currentChannelId, chName);
      }
    }

    // PLAY VIDEO DENGAN PENYESUAIAN FRAME OTOMATIS (SHORTS VS LONG)
    function playVideo(id, title = 'YouTube Video', author = 'YouTube', channelId = '', explicitShort = false) {
      currentVideoId = id;
      currentChannelId = channelId;

      const titleLower = title.toLowerCase();
      isCurrentVideoShort = explicitShort || titleLower.includes('#shorts') || titleLower.includes('#short') || titleLower.includes('shorts');

      const wrapper = document.getElementById('videoWrapper');
      const fsBtn = document.getElementById('fullscreenBtn');

      if (isCurrentVideoShort) {
        wrapper.classList.add('shorts-mode');
        fsBtn.innerHTML = `<i class="fa-solid fa-mobile-screen"></i> Portrait Fullscreen`;
      } else {
        wrapper.classList.remove('shorts-mode');
        fsBtn.innerHTML = `<i class="fa-solid fa-expand"></i> Landscape Fullscreen`;
      }

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(id);
      }

      document.getElementById('currentVideoTitle').innerText = title;
      document.getElementById('currentChannelName').innerText = author;

      addToHistory({ id, title, author, channelId, isShort: isCurrentVideoShort });
      renderSidebar();
    }

    function addToHistory(item) {
      watchHistory = watchHistory.filter(v => v.id !== item.id);
      watchHistory.unshift(item);
      if (watchHistory.length > 30) watchHistory.pop();
      localStorage.setItem('zentube_history', JSON.stringify(watchHistory));
    }

    function addToPlaylist(item) {
      if (!savedPlaylist.some(v => v.id === item.id)) {
        savedPlaylist.unshift(item);
        localStorage.setItem('zentube_playlist', JSON.stringify(savedPlaylist));
        alert('Video berhasil disimpan ke Playlist Saya!');
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabSearchResults').classList.toggle('active', tab === 'search');
      document.getElementById('tabPlaylist').classList.toggle('active', tab === 'playlist');
      document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
      renderSidebar();
    }

    function renderSidebar() {
      const container = document.getElementById('sidebarContainer');
      container.innerHTML = '';

      let list = [];
      if (activeTab === 'search') list = searchResults;
      else if (activeTab === 'playlist') list = savedPlaylist;
      else if (activeTab === 'history') list = watchHistory;

      if (list.length === 0) {
        container.innerHTML = `<p style="font-size:12px; color:var(--text-sub); text-align:center; padding:30px;">
          ${activeTab === 'search' ? 'Tidak ada video ditemukan.' : (activeTab === 'playlist' ? 'Belum ada video disimpan.' : 'Riwayat tontonan masih kosong.')}
        </p>`;
        return;
      }

      list.forEach((item) => {
        const activeClass = item.id === currentVideoId ? 'active' : '';
        const titleLower = (item.title || '').toLowerCase();
        const isShortItem = item.isShort || titleLower.includes('#shorts') || titleLower.includes('shorts');

        const itemEl = document.createElement('div');
        itemEl.className = `video-item ${activeClass} ${isShortItem ? 'is-short-item' : ''}`;

        if (item.isChannel) {
          itemEl.onclick = () => openChannelVideos(item.channelId, item.author);
          itemEl.innerHTML = `
            <div class="item-thumb" style="border-radius: 50%; aspect-ratio: 1/1; width: 45px;">
              <img src="${item.thumb}" alt="channel">
            </div>
            <div class="item-details">
              <div class="item-title" style="color: var(--accent); font-weight:700;">${item.title}</div>
              <div class="item-author">Klik untuk eksplorasi channel</div>
            </div>
          `;
        } else {
          itemEl.onclick = () => playVideo(item.id, item.title, item.author, item.channelId, isShortItem);
          const thumb = `https://img.youtube.com/vi/${item.id}/hqdefault.jpg`;

          itemEl.innerHTML = `
            <div class="item-thumb">
              <img src="${thumb}" alt="thumb">
            </div>
            <div class="item-details">
              <div class="item-title">${item.title}</div>
              <div class="item-author" onclick="event.stopPropagation(); if('${item.channelId}') openChannelVideos('${item.channelId}', '${item.author}')">${item.author}</div>
            </div>
            ${activeTab !== 'playlist' ? `
              <button class="btn-add-playlist" title="Simpan ke Playlist" onclick="event.stopPropagation(); addToPlaylist(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                <i class="fa-solid fa-plus"></i>
              </button>
            ` : ''}
          `;
        }

        container.appendChild(itemEl);
      });
    }

    // FULLSCREEN DENGAN ROTASI OTOMATIS CERDAS (SHORTS VS LONG)
    async function toggleFullScreen() {
      const elem = document.getElementById('videoWrapper');
      
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
        if (elem.requestFullscreen) {
          await elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          await elem.webkitRequestFullscreen();
        } else if (elem.mozRequestFullScreen) {
          await elem.mozRequestFullScreen();
        }

        if (screen.orientation && screen.orientation.lock) {
          const targetOrientation = isCurrentVideoShort ? 'portrait' : 'landscape';
          screen.orientation.lock(targetOrientation).catch(err => console.log('Orientation lock warning:', err));
        }
      } else {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          await document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          await document.mozCancelFullScreen();
        }

        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    }

    function toggleTheaterMode() {
      document.getElementById('mainGrid').classList.toggle('theater-mode');
      document.getElementById('theaterBtn').classList.toggle('active');
    }

    function copyCurrentLink() {
      const url = `https://www.youtube.com/watch?v=${currentVideoId}`;
      navigator.clipboard.writeText(url).then(() => alert('Link video berhasil disalin!'));
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadTrendingVideos();
    });
  </script>
</body>
