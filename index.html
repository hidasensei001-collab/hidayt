<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenTube - Premium YouTube Player & Search</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --bg-dark: #0f172a;
      --glass-bg: rgba(15, 23, 42, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-card: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: var(--bg-dark);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 20px 16px; }

    /* Header & Navigation */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      padding: 16px 24px;
      border-radius: 20px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 20px;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .brand i { color: #ef4444; -webkit-text-fill-color: initial; }

    /* Search Bar */
    .search-box {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 600px;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.3s;
    }

    .search-input-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
    }

    .btn-action {
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-action:hover { transform: translateY(-2px); opacity: 0.95; }

    /* Main Layout Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      transition: all 0.3s ease;
    }

    .main-grid.theater-mode {
      grid-template-columns: 1fr;
    }

    .main-grid.theater-mode .sidebar-section {
      display: none;
    }

    /* Player Container */
    .player-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .player-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .video-info h2 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .video-info p {
      font-size: 12px;
      color: var(--text-sub);
    }

    .action-btns {
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-icon.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* Sidebar Tabs & Lists */
    .sidebar-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      height: fit-content;
      max-height: 720px;
      display: flex;
      flex-direction: column;
    }

    .tab-header {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .video-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-right: 4px;
      max-height: 560px;
    }

    .video-list::-webkit-scrollbar { width: 4px; }
    .video-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

    .video-item {
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--glass-border);
      padding: 8px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .video-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(3px);
    }

    .video-item.active {
      border-color: var(--accent);
      background: rgba(6, 182, 212, 0.12);
    }

    .item-thumb {
      width: 100px;
      height: 58px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .item-title {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .item-author {
      font-size: 11px;
      color: var(--text-sub);
    }

    .btn-add-playlist {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(6, 182, 212, 0.2);
      border: none;
      color: var(--accent);
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .video-item:hover .btn-add-playlist { display: flex; }
    .btn-add-playlist:hover { background: var(--accent); color: #fff; }

    /* Modal API Key */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.hidden { display: none; }

    .modal-card {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
    }

    .modal-card h3 { font-size: 16px; margin-bottom: 8px; color: #fff; }
    .modal-card p { font-size: 12px; color: var(--text-sub); margin-bottom: 16px; line-height: 1.5; }
    .modal-card input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 16px;
      outline: none;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
      .search-box { width: 100%; max-width: 100%; }
      .nav-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- NAVBAR -->
    <div class="nav-bar">
      <div class="brand">
        <i class="fa-brands fa-youtube"></i> ZenTube Premium
      </div>
      
      <div class="search-box">
        <div class="search-input-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Cari judul video atau paste link YouTube..." onkeyup="handleKeyPress(event)">
        </div>
        <button class="btn-action" onclick="executeSearch()">
          <i class="fa-solid fa-magnifying-glass"></i> Cari
        </button>
      </div>

      <button class="btn-icon" onclick="openApiModal()">
        <i class="fa-solid fa-key"></i> API Key
      </button>
    </div>

    <!-- MAIN GRID -->
    <div class="main-grid" id="mainGrid">
      
      <!-- PLAYER -->
      <div class="player-section">
        <div class="player-card">
          <div class="video-wrapper">
            <iframe id="mainPlayer" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          
          <div class="player-controls">
            <div class="video-info">
              <h2 id="currentVideoTitle">Lofi Hip Hop Radio - Beats to Relax/Study to</h2>
              <p id="currentVideoSubtitle">Sedang Diputar • Playback Active</p>
            </div>
            <div class="action-btns">
              <button class="btn-icon" id="theaterBtn" onclick="toggleTheaterMode()">
                <i class="fa-solid fa-expand"></i> Teater
              </button>
              <button class="btn-icon" onclick="copyCurrentLink()">
                <i class="fa-solid fa-share-nodes"></i> Bagikan
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- SIDEBAR -->
      <div class="sidebar-section">
        <div class="sidebar-card">
          <div class="tab-header">
            <button class="tab-btn active" id="tabSearchResults" onclick="switchTab('search')">
              <i class="fa-solid fa-magnifying-glass"></i> Hasil Cari
            </button>
            <button class="tab-btn" id="tabPlaylist" onclick="switchTab('playlist')">
              <i class="fa-solid fa-list"></i> Playlist Saya
            </button>
          </div>

          <div class="video-list" id="sidebarContainer">
            <!-- Item dirender via JS -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- MODAL API KEY -->
  <div class="modal-overlay hidden" id="apiModal">
    <div class="modal-card">
      <h3><i class="fa-solid fa-key" style="color: var(--accent);"></i> YouTube Data API Key</h3>
      <p>Masukkan API Key dari Google Cloud Console agar hasil pencarian langsung menampilkan gambar thumbnail & judul resmi di sidebar.</p>
      <input type="text" id="apiKeyInput" placeholder="Paste API Key kamu di sini...">
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="btn-icon" onclick="closeApiModal()">Batal</button>
        <button class="btn-action" onclick="saveApiKey()">Simpan Key</button>
      </div>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('zentube_api_key') || '';
    let currentVideoId = 'jfKfPfyJRdk';
    let activeTab = 'search';
    
    let searchResults = [];
    let savedPlaylist = JSON.parse(localStorage.getItem('zentube_playlist')) || [
      { id: 'jfKfPfyJRdk', title: 'Lofi Girl - Beats to Study To', author: 'Lofi Girl' },
      { id: '5qap5aO4i9A', title: 'Lofi Hip Hop Radio - Sleep Beats', author: 'Lofi Girl' }
    ];

    function extractYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') executeSearch();
    }

    async function executeSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const directId = extractYouTubeID(query);

      // Jika input adalah Link URL / ID
      if (directId) {
        playVideo(directId, `Video (${directId})`, 'Direct Link');
        return;
      }

      // Jika ada API Key -> Cari via YouTube Data API v3
      if (apiKey) {
        try {
          const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${apiKey}`);
          const data = await res.json();
          
          if (data.items && data.items.length > 0) {
            searchResults = data.items.map(item => ({
              id: item.id.videoId,
              title: item.snippet.title,
              author: item.snippet.channelTitle
            }));

            switchTab('search');
            playVideo(searchResults[0].id, searchResults[0].title, searchResults[0].author);
            return;
          }
        } catch (err) {
          console.warn('API Key Error/Expired, fallback ke Player Search mode.', err);
        }
      }

      // Fallback tanpa API Key: Putar langsung via Embed Search Playlist
      const iframe = document.getElementById('mainPlayer');
      iframe.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1`;
      document.getElementById('currentVideoTitle').innerText = `Hasil Pencarian: "${query}"`;
      document.getElementById('currentVideoSubtitle').innerText = 'Mode Pencarian Langsung YouTube';
      
      searchResults = [{
        id: 'search_mode',
        title: `Pencarian: ${query}`,
        author: 'YouTube Search Mode'
      }];
      switchTab('search');
    }

    function playVideo(id, title = 'YouTube Video', author = 'YouTube') {
      currentVideoId = id;
      const iframe = document.getElementById('mainPlayer');
      iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1`;

      document.getElementById('currentVideoTitle').innerText = title;
      document.getElementById('currentVideoSubtitle').innerText = `${author} • Sedang Diputar`;

      renderSidebar();
    }

    function addToPlaylist(item) {
      if (!savedPlaylist.some(v => v.id === item.id)) {
        savedPlaylist.unshift(item);
        localStorage.setItem('zentube_playlist', JSON.stringify(savedPlaylist));
        alert('Video dimasukkan ke Playlist Saya!');
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabSearchResults').classList.toggle('active', tab === 'search');
      document.getElementById('tabPlaylist').classList.toggle('active', tab === 'playlist');
      renderSidebar();
    }

    function renderSidebar() {
      const container = document.getElementById('sidebarContainer');
      container.innerHTML = '';

      const list = activeTab === 'search' ? searchResults : savedPlaylist;

      if (list.length === 0) {
        container.innerHTML = `<p style="font-size:12px; color:var(--text-sub); text-align:center; padding:20px;">
          ${activeTab === 'search' ? 'Ketik kata kunci di atas untuk mencari video.' : 'Belum ada video tersimpan.'}
        </p>`;
        return;
      }

      list.forEach((item) => {
        const activeClass = item.id === currentVideoId ? 'active' : '';
        const itemEl = document.createElement('div');
        itemEl.className = `video-item ${activeClass}`;
        itemEl.onclick = () => playVideo(item.id, item.title, item.author);

        const thumb = item.id !== 'search_mode' 
          ? `https://img.youtube.com/vi/${item.id}/hqdefault.jpg` 
          : 'https://via.placeholder.com/100x58/0f172a/06b6d4?text=Search';

        itemEl.innerHTML = `
          <div class="item-thumb">
            <img src="${thumb}" alt="thumb">
          </div>
          <div class="item-details">
            <div class="item-title">${item.title}</div>
            <div class="item-author">${item.author}</div>
          </div>
          ${activeTab === 'search' && item.id !== 'search_mode' ? `
            <button class="btn-add-playlist" title="Simpan ke Playlist" onclick="event.stopPropagation(); addToPlaylist(${JSON.stringify(item).replace(/"/g, '&quot;')})">
              <i class="fa-solid fa-plus"></i>
            </button>
          ` : ''}
        `;
        container.appendChild(itemEl);
      });
    }

    function toggleTheaterMode() {
      document.getElementById('mainGrid').classList.toggle('theater-mode');
      document.getElementById('theaterBtn').classList.toggle('active');
    }

    function copyCurrentLink() {
      const url = `https://www.youtube.com/watch?v=${currentVideoId}`;
      navigator.clipboard.writeText(url).then(() => alert('Link disalin!'));
    }

    function openApiModal() {
      document.getElementById('apiModal').classList.remove('hidden');
      document.getElementById('apiKeyInput').value = apiKey;
    }

    function closeApiModal() {
      document.getElementById('apiModal').classList.add('hidden');
    }

    function saveApiKey() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('zentube_api_key', apiKey);
      closeApiModal();
      alert('API Key berhasil disimpan!');
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
    });
  </script>
</body>
</html>
